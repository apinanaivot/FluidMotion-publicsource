; Fluid Motion: Pathfinding Overhaul configuration. Re-read every time you load a save.
; Log location: Documents\My Games\Skyrim Special Edition\SKSE\FluidMotion.log

[FluidMotion]
; true = Fluid Motion mode at startup, false = vanilla. The SKSE Menu Framework key (F1) opens the menu, which
; switches modes live. Every log line and trace row is tagged with the active mode.
bEnabled = true
; false = only the pathfinding changes (path fixes below and [Jump]) are off while the rest of Fluid Motion stays on.
bPathfinding = true

; Fix settings (Fluid mode only).
; Path steering: the follower's correction back toward its path is spread over at least
; speed x this many seconds, so running animals don't zigzag across it. 0 = vanilla.
fSteerLookTime = 0.5
; Corner speed: speed allowed through a path corner = radius of the largest arc that fits
; the corner x the actor's turn rate x this multiplier.
fCornerTurnRateScale = 2
; New paths: animals stop and turn on the spot only when a new path starts more than this
; many degrees off their heading (vanilla 15); below it they steer in while moving.
fTurnInPlaceAngle = 120
; Path end: deceleration (u/s2) used when the path end is what limits speed. Vanilla brakes
; at 354 while running, from ~1000 u out.
fEndDecel = 2000

[Jump]
; Jump traversal (Fluid mode only). Distances in game units (70 u ~ 1 m).
bEnabled = true
; Jump across a long detour of the actor's own path (fence, ledge, gap) to a node further along it.
bShortcut = true
; Melee attacker that can't get closer to a target standing clearly above/below it jumps beside it.
bPursuit = false
; Same for a follower stuck below or above the player.
bFollow = true
; Gravity of the planned arc (u/s2). Real gravity is ~686; higher looks snappier.
fGravity = 900
; Max rise above the take-off point = actor height x fUpPerHeight, clamped to [fUpMin, fUpMax]
; (a human is ~128 tall: 147 u, about 2.1 m).
fUpPerHeight = 1.15
fUpMin = 60
fUpMax = 180
; Max drop.
fDownMax = 450
; Max horizontal distance = actor height x fDistPerHeight, clamped to [fDistMin, fDistMax].
fDistPerHeight = 2.0
fDistMin = 150
fDistMax = 350
; Taller actors never jump.
fMaxActorHeight = 300
; Shortcut only when it saves at least fMinSaving of path and path/jump length >= fMinRatio.
fMinSaving = 300
fMinRatio = 1.6
; Horizontal launch speed range (the actor's own speed x 1.15, clamped).
fMinSpeed = 250
fMaxSpeed = 600
; Feet clearance over obstacles along the arc.
fClearance = 12
; Seconds before the same actor may jump again.
fCooldown = 1.5
; Actors moved by hand (route legs, jump arcs) turn at most this fast (deg/s) and speed up at fGlideAccel (u/s2).
fTurnRateDeg = 420
; A follower is only routed by us when this far from the player and standing still (vanilla can't reach).
fFollowRouteMin = 500
fGlideAccel = 700
; Driven actors follow the ground height at most this fast (u/s) up and down, so rock edges don't snap them.
fDriveRise = 220
fDriveFall = 500
; Pursuit/follow fire after this many seconds without getting closer to the target.
fPursuitStuckSec = 1.0
fFollowStuckSec = 2.0
; Pursuit only when the target is at least this much higher, or fPursuitMinDrop lower.
fPursuitMinRise = 70
fPursuitMinDrop = 120
; 0 = each frame set position, velocity and the in-air state; 1 = position only.
iDriveMode = 0
; Races that never jump (they still route on foot): case-insensitive parts of the race editor ID.
sExcludeRaces = Dragon,Alduin,Mammoth,Horker,Mudcrab,Slaughterfish,Centurion,Sphere,Wisp,Netch,Fish,Torchbug,Moth,Butterfly,Dragonfly,Hawk,Crow,Chicken,Cow,Goat
; Behaviour-graph events sent at take-off and landing. Humanoids share the player's graph; most
; creatures have no jump animation, so they keep their run animation through the arc.
; Races that neither jump nor route (fliers, swimmers).
sNoRouteRaces = Dragon,Alduin,Slaughterfish,Fish,Wisp,Netch,Torchbug,Moth,Butterfly,Dragonfly,Hawk,Crow
; Non-NPC races that get the human climb clip and jump animation events (never above fGiantHeight).
sClimbRaces = Draugr,Falmer,Hagraven,Forsworn,Skeleton
; Races that route up steep ground (rise per walk edge fSteepRise, cost x fSteepCost).
sSteepRaces = Bear,Spider,Chaurus,Sabre,Goat,Troll
fSteepRise = 130
fSteepCost = 1.4
; Routes wade through water up to this fraction of the body height deep (0 = never), at this cost multiplier. Deeper water is left to vanilla swimming.
fWadeDepth = 0.45
fWadeCost = 1.5
; Idle melee actor whose target is more than this many body heights below (or half above) routes to its level.
fVertMismatch = 1.0
; Actors taller than this (giants) jump higher and further than the normal caps.
fGiantHeight = 220
fGiantDistMax = 700
fGiantUpPerHeight = 1.4
fGiantDistPerHeight = 2.6
sNpcStartEvent = JumpDirectionalStart
sNpcLandEvent = JumpLand
sCreatureStartEvent =
sCreatureLandEvent =
; JUMP / LAND / AFTERLAND / JUMPREJECT lines and a JumpStats line every minute.
bLog = true

[Debug]
; Startup state of the debug overlay; all can be toggled live in the menu (SKSE Menu Framework).
; Navmesh wireframe around the player (orange = open edges, red/magenta = engine ledge links).
bShowNavmesh = false
; Actor paths, launched jumps (green) and rejected jump attempts (red, with the reason).
bShowPaths = false
fRadius = 2500

[Telemetry]
bEnabled = false
iSampleIntervalMs = 33
; Only actors within this many units of the player (10000 is about 140 m). Fleeing animals
; used to leave the old 6000 radius mid-chase, which cut their episodes short.
fRadius = 10000
bTrackFleeing = true
bTrackCombat = true
; Prey animals (elk, deer) run away without the flee or combat flags, so track any actor
; that starts running (speed >= fFastSpeed).
bTrackRunning = true
; Speed thresholds in units/s (horizontal). Walking is roughly 80-130; check the max= values
; in the log for real run speeds per creature and adjust fFastSpeed if needed.
fFastSpeed = 150
fSlowSpeed = 40
fTurnSegment = 64
fSharpTurnDeg = 60
fEpisodeGraceSec = 3.0
fMinEpisodeSec = 2.0
; Writes FluidMotion_trace_<date>_<time>.csv next to the log, one per game session
; (a few MB/min with several actors). Can also be toggled in the menu.
bWriteTraceCsv = false

[Spider]
; Procedural spider legs (Fluid mode). Frostbite (8 legs) and Dwarven spiders (6 legs): the legs are fully IK driven,
; feet stick to the ground, the body follows the feet. Front claws (Arm*), fangs and tail stay vanilla.
bEnabled = true
iMaxSpiders = 6
fRadius = 2500
fStepDist = 20
fStepDistSpeed = 0.07
fStepDistMax = 32
fOvershoot = 0.6
fStepHeight = 12
fSwingFrac = 0.45
fSwingFracSlow = 0.33
fSwingMin = 0.08
fSwingMax = 0.80
; Body speed (u/s) below which swings stop getting longer (stepping in place / turning)
fSwingSlow = 30
fFootSpeed = 0
; Step distance scale when walking sideways (1 = same as forward)
fSideStep = 0.5
fBodyTime = 0.10
fMaxTiltDeg = 25
fFade = 0.15
; Main thread re-applies the last leg pose when something overwrote it after the graph update (SPIDERPROBE log).
bRecommit = true
; Omnidirectional movement: spider races get sideways/backwards speeds (the engine then walks them toward the path
; without stopping to turn, graph plays the left/right/backward clips) and a rotation speed cap in deg/s.
bOmni = true
fMaxTurnDeg = 75
fSideSpeed = 0.6
fBackSpeed = 0.5
sRaces = Spider
bLog = true

[SpiderClimb]
; Spiders crawl along any surface up to ~90 deg (walls, rocks): driven by hand, legs follow the surface (SpiderLegs).
; A combat spider starts when its target is fEngage close and fMinRise higher (or it made no progress for fStuckSec).
bEnabled = true
fSpeed = 230
fAccel = 600
fTurnDeg = 90
fEngage = 2500
fMinRise = 80
fStuckSec = 1.5
fStopDist = 105
fHover = 30
fStand = 34
fMaxAngleDeg = 100
fSideFrac = 0.6
fBackFrac = 0.5
; Personal space of a crawling spider: steers apart from other actors, pushed out of overlaps
fSepRadius = 60
fMaxSeconds = 40
fCooldown = 3
bLog = true

[Anim]
; Animation layer (Fluid mode only). Each part can be switched off; ANIM lines go to the log.
bEnabled = true
; bPlayer = false: the player is fully vanilla. bPlayerMotion = false: vanilla player movement, turning and camera (no
; acceleration, heading, camera spring, motion matching or ledge climbing); the pose effects still apply to the player.
bPlayer = true
bPlayerMotion = true
bNpcs = true
fRadius = 1800
iMaxActors = 24
; Ground/ceiling rays per actor per second, and the cap per frame.
fCastHz = 25
iMaxRays = 90
; Graph Speed follows measured speed when blocked (no running in place).
bSpeedSync = true
bStepOver = true
bDuck = true
bSlopeLean = true
bTurnLean = true
bHeadLead = true
; Crouch after a fall of fLandMinFall u (full at +fLandRef); settle dip when braking from a run; hips and shoulders turn toward the movement direction when strafing.
bLandCrouch = true
bStopSettle = true
; Motion matching (player only; needs FluidMotion_mm.bin, which is not included): legs, hips and spine follow the best matching mocap frame while moving. Arms/head stay with the graph unless bMMArms.
bMotionMatch = false
bMMArms = false
; Player: neck and head may bend at most this far (deg) off their vanilla angle to the bone they hang from (log ANIMNECK).
fNeckMaxBendDeg = 15
fMMSearchHz = 8
fMMHalflife = 0.12
fMMMargin = 0.2
; Steady forward walking/running prefers the vanilla walk/run loops baked into the database (their cost x fMMVanillaBias), so
; motion matching steps into them at the matching foot. Sprinting is always vanilla.
bMMVanillaForward = true
fMMVanillaBias = 0.5
; Player movement in world space (bPlayerAccel): speed follows the input with this half-life (s, stopping twice as fast); the direction
; is the input direction at once; the visible body turns into it at fPlayerTurnDeg deg/s.
bPlayerAccel = true
fPlayerAccel = 0.15
fPlayerTurnDeg = 300
; With the weapon sheathed (3rd person, also in combat) the player faces the movement direction and the camera only steers it, instead of
; the engine turning the player to the camera.
bPlayerHeading = true
; The same with a weapon drawn (off = vanilla: the body faces the camera and strafes). Attacks and blocking turn the body to the camera.
bCombatFreeCamera = false
; With the combat free camera: an attack or a block turns the body to the camera (false = the body keeps the movement heading).
bAttackTurn = true
; Speed smoothing (acceleration) for the player also in first person (false = vanilla movement there). Motion matching is never
; used in first person.
bFirstPersonMotion = false
; Pose edits refresh bones with the engine's full node update (old behaviour; flashed attached items like the quiver) instead of
; computing world transforms directly.
fMMRateMin = 0.7
fMMRateMax = 1.5
; Hands on nearby walls, poles and low ceilings while no weapon is drawn.
bTouchWalls = false
; Blocked by an obstacle between fClimbMin and fClimbMaxFrac x height: climb it (player and NPCs).
bClimb = true
fClimbMin = 38
fClimbMaxFrac = 0.8
; Seconds to get hands-on-ledge, seconds to blend back to the graph at the end, clip playback speed.
fClimbApproach = 0.1
fClimbTail = 0.35
fClimbRate = 1.2
; After a jump, a ledge a little above head height: hang from it and pull up (ends crouched, fHangTail s fade out).
bHang = true
; The player may climb / hang at all (false = never; NPCs are unaffected).
bPlayerClimb = true
fHangTail = 0.55
fStepMax = 40
fFootClear = 3
fLeadTime = 0.15
fDuckMargin = 14
fDuckMax = 40
fBankGain = 0.4
fBankMaxDeg = 14
fHeadLeadSec = 0.35
fHeadMaxDeg = 30
fSlopeMinDeg = 8
fSlopeGain = 0.65
fSlopeMaxDeg = 22
fSlopeBackGain = 1.2
fSlopeBackMaxDeg = 20
; Stop settle: horizontal speed lost within 0.25 s (u/s) that triggers it; a loss of fDipRef gives a full one.
fDipDecel = 180
fDipRef = 500
fDipDrop = 14
fDipPitchDeg = 10
fStopScale = 0.5
fLandMinFall = 110
fLandRef = 350
bLog = true

[Combat]
; Melee actors in combat that stand within reach of their target, facing it, without attacking for fSwingIdleSec get an attack start.
bSwing = true
fSwingIdleSec = 0.35
fSwingCooldown = 1.2
fSwingReach = 0.9
fSwingAngleDeg = 30
bLog = true

[GameSettingsDump]
; At startup, log every game setting (GMST) whose name contains one of these.
bEnabled = false
sKeywords = Flee,Path,Avoid,Turn,Move,Run,Walk,Steer,Navmesh,Pursue,Detour,Stuck,CombatAttack,CombatAim,CombatAngle,CombatBetween,CombatApproachTarget,CombatForward,CombatStrafe,CombatStep,CombatMelee

[GameSettings]
; Raw GMST overrides for experiments, applied only in Fluid Motion mode.
; The name must match a GMST from the dump exactly; the type comes from its prefix
; (f=float, i=int, b=bool). Re-read every time you load a save.
